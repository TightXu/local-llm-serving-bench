<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>vLLM Chat</title>
</head>
<body>
    <h2>vLLM local chat test</h2>
    <label>Model:</label>
    <select id="modelSelect"></select><br><br>
    <textarea id="input" rows="3" cols="60" placeholder="Type your question..."></textarea><br>
    <button onclick="send()">Send</button>
    <pre id="output" style="background:#f4f4f4; padding:10px; white-space:pre-wrap;"></pre>

    <script>
        const output = document.getElementById('output');
        const modelSelect = document.getElementById('modelSelect');

        // 1. fetch the model list automatically when the page loads
        async function loadModels() {
            try {
                const resp = await fetch('http://localhost:8000/v1/models');
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const data = await resp.json();
                const models = data.data || [];
                if (models.length === 0) {
                    output.textContent = 'No models found. Check that vLLM is running.';
                    return;
                }
                models.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.id;
                    opt.textContent = m.id;
                    modelSelect.appendChild(opt);
                });
            } catch (e) {
                output.textContent = 'Failed to fetch the model list: ' + e.message;
            }
        }
        loadModels();

        // 2. send a message
        async function send() {
            const prompt = document.getElementById('input').value;
            const model = modelSelect.value;
            if (!model) {
                output.textContent = 'Select a model first.';
                return;
            }
            output.textContent = 'Waiting for the response...';
            try {
                const resp = await fetch('http://localhost:8000/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: model,
                        messages: [{ role: 'user', content: prompt }],
                        temperature: 0.6,
                        top_p: 0.95,
                        max_tokens: 500
                    })
                });
                const data = await resp.json();
                // show the full response, handy when debugging
                output.textContent = JSON.stringify(data, null, 2);
                // if there is a normal reply, extract and show it separately
                if (data.choices && data.choices[0] && data.choices[0].message) {
                    output.textContent = data.choices[0].message.content;
                }
            } catch(e) {
                output.textContent = 'Error: ' + e.message;
            }
        }
    </script>
</body>
</html>
